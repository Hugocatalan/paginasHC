<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0e1722"/>
      <stop offset="100%" stop-color="#05080c"/>
    </linearGradient>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0098ff"/>
      <stop offset="100%" stop-color="#22b7ff"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Fondo redondeado con borde sutil -->
  <rect x="2" y="2" width="60" height="60" rx="16" fill="url(#bg)" stroke="url(#cyanGrad)" stroke-width="2"/>

  <!-- Logo de marca <V/> con brillo -->
  <text x="32" y="39" 
        font-family="'Space Grotesk', system-ui, -apple-system, sans-serif" 
        font-size="17" 
        font-weight="800" 
        fill="#22b7ff" 
        text-anchor="middle" 
        filter="url(#glow)">&lt;V/&gt;</text>
</svg>
